[package]
name = "bge-m3-embedding-server"
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Axum HTTP server serving BGE-M3 dense and sparse embeddings via ONNX Runtime"
repository = "https://github.com/Fulton-Engineering-Services/bge-m3-embedding-server"
readme = "README.md"
keywords = ["embeddings", "bge-m3", "axum", "nlp", "onnxruntime"]
categories = ["web-programming::http-server"]
rust-version = "1.88"

[lib]
name = "bge_m3_embedding_server"
path = "src/lib.rs"

[[bin]]
name = "bge-m3-embedding-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
indexmap = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
## `tracing` is required so the ORT crate's own `crate::info!`/`warn!`/`error!`
## calls — including `apply_execution_providers`' "Successfully registered" /
## "Couldn't register" / "An error occurred when attempting to register" lines
## and the C-side `tracing_logger` callback — actually fire. Without it, ORT
## registration failures are completely silent, which masked the
## `nvrtx`-prebuilt / standard-TRT-EP-missing failure that produced the
## 2026-05 codekeeper outage. Greppable in CloudWatch via `target=ort` events.
ort = { version = "=2.0.0-rc.12", features = ["coreml", "ndarray", "std", "api-24", "tracing"], default-features = false }
hf-hub = "0.5"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
safetensors = "0.7"
ndarray = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
uuid = { version = "1", features = ["v4"] }
nvml-wrapper = { version = "0.12.1", optional = true }

[features]
## Emit per-op CoreML hardware dispatch decisions to stderr at model load time.
## Diagnostic only — enable when profiling which ops run on GPU vs CPU.
##
## Usage with benchmarks:
##   BGE_M3_BENCH_EP=coreml_all cargo bench --bench coreml --features coreml-profile
## Usage with the server:
##   cargo run --features coreml-profile
coreml-profile = []

## Let ort-sys download a prebuilt ONNX Runtime binary during build.
## Used in CI where ORT_LIB_LOCATION is unavailable. Never enable in
## production builds — use ORT_LIB_LOCATION with a locally built ORT instead.
download-ort = ["ort/download-binaries", "ort/tls-rustls"]

## Enable NVML-based per-device GPU VRAM and utilization heartbeat logging.
## Pulled in automatically by the `cuda` and `tensorrt` features; never needs
## to be set manually. CPU builds do not depend on nvml-wrapper at all.
nvml = ["dep:nvml-wrapper"]

## Enable the NVIDIA CUDA execution provider.
## Requires a CUDA-enabled ORT build (ORT_LIB_LOCATION pointing to a CUDA EP build,
## or `download-ort` with a CUDA prebuilt). CPU-only builds are unaffected by this
## feature gate — it is a no-op on macOS (CoreML is always used there).
cuda = ["ort/cuda", "nvml"]

## Enable the NVIDIA TensorRT execution provider.
## TRT requires the CUDA EP underneath; this feature pulls in both.
## Requires a TensorRT-enabled ORT build. Falls back to the CUDA EP if TRT
## registration fails at runtime. CPU-only builds are unaffected.
tensorrt = ["ort/cuda", "ort/tensorrt", "nvml"]

## Compile-time opt-in for the stale-SM TRT engine cache GC.
##
## **NEVER enable in a production binary that is deployed against a shared
## EFS engine cache in a multi-SM ASG.** ORT TRT EP namespaces engine plan
## filenames by compute capability (`_smXX`) so plans for different SMs
## coexist safely; the GC would delete plans that are still active for
## peer tasks running on different hardware. Enable ONLY in dedicated
## maintenance or development binaries whose binary is not deployed
## against a shared production cache.
##
## When this feature is off, the GC code is physically absent from the
## binary — `BGE_M3_TRT_CACHE_GC_ENABLED=1` is silently ignored. When the
## feature is on, the runtime env var still defaults to `false` and a
## destructive WARN is logged before any deletion. See `docs/cache-gc.md`
## (or the README section "Stale-SM Cache GC") for the full hazard model.
cache-gc = []

## Enable optional native TLS via axum-server + tokio-rustls.
## When `BGE_M3_TLS_CERT_PATH` and `BGE_M3_TLS_KEY_PATH` are both set at
## runtime, the server binds HTTPS instead of HTTP. When either is absent,
## the server falls back to plain HTTP.
tls = ["dep:axum-server"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }
sha2 = "0.11"
tempfile = "3"

[[bench]]
name = "embeddings"
harness = false

[[bench]]
name = "coreml"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
