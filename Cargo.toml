[package]
name = "bge-m3-embedding-server"
version = "0.15.0-rc9"
edition = "2021"
license = "Apache-2.0"
description = "Axum HTTP server serving BGE-M3 dense and sparse embeddings via ONNX Runtime"
repository = "https://github.com/Fulton-Engineering-Services/bge-m3-embedding-server"
readme = "README.md"
keywords = ["embeddings", "bge-m3", "axum", "nlp", "onnxruntime"]
categories = ["web-programming::http-server"]
rust-version = "1.88"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
ort = { version = "=2.0.0-rc.12", features = ["coreml", "ndarray", "std", "api-24", "download-binaries", "tls-rustls"], default-features = false }
hf-hub = "0.5"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
safetensors = "0.7"
ndarray = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
uuid = { version = "1", features = ["v4"] }

[features]
## Emit per-op CoreML hardware dispatch decisions to stderr at model load time.
## Diagnostic only — enable when profiling which ops run on GPU vs CPU.
##
## Usage with benchmarks:
##   BGE_M3_BENCH_EP=coreml_all cargo bench --bench coreml --features coreml-profile
## Usage with the server:
##   cargo run --features coreml-profile
coreml-profile = []

## Let ort-sys download a prebuilt ONNX Runtime binary during build.
## Used in CI where ORT_LIB_LOCATION is unavailable. Never enable in
## production builds — use ORT_LIB_LOCATION with a locally built ORT instead.
download-ort = ["ort/download-binaries", "ort/tls-native"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }
sha2 = "0.11"
tempfile = "3"

[[bench]]
name = "embeddings"
harness = false

[[bench]]
name = "coreml"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
