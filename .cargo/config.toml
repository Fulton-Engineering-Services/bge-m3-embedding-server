# Apple Silicon local builds — target-cpu=native enables i8mm, bf16, bti
# beyond the M1 baseline. This section is ignored when building for any
# other target triple (e.g., x86_64-unknown-linux-gnu in CI/Docker).
#
# Trade-off: binaries are not reproducible across machines (M1 vs M2 vs M3
# produce different codegen). Acceptable here because production deploys via
# Docker (linux/amd64 + linux/arm64) which does not use this config section.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
