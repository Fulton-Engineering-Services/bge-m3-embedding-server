# Prerequisites (one-time manual setup):
# 1. In repo Settings → Pages → Source: select "GitHub Actions"
# 2. Run workflow_dispatch (or push to main) to trigger the first deployment.
#    Subsequent pushes to main that touch the watched paths deploy automatically.

name: Deploy JupyterLite to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/visuals/notebooks/**'
      - 'binder/requirements.txt'
      - '.github/workflows/jupyterlite.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build JupyterLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install JupyterLite
        run: |
          pip install \
            jupyterlite-core==0.7.6 \
            jupyterlite-pyodide-kernel==0.7.2 \
            jupyter-server==2.15.0

      - name: Copy notebooks to build input
        run: |
          mkdir -p _input
          cp tools/visuals/notebooks/*.ipynb _input/

      - name: Build JupyterLite site
        run: |
          jupyter lite build --contents _input/ --output-dir _output/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _output/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
