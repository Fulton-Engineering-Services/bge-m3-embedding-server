name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2
      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings --default-theme light --html-in-header docs/rustdoc-theme-init.html" cargo doc --no-deps --document-private-items
      - name: Add redirect index
        run: echo '<meta http-equiv="refresh" content="0;url=bge_m3_embedding_server/index.html">' > target/doc/index.html
      - name: Upload rustdoc artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: rustdoc
          path: target/doc
          retention-days: 1

  build-notebooks:
    name: Build JupyterLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install JupyterLite
        run: |
          pip install \
            jupyterlite-core==0.7.6 \
            jupyterlite-pyodide-kernel==0.7.2 \
            jupyter-server==2.15.0 \
            ipympl==0.9.7
      - name: Copy notebooks to build input
        run: |
          mkdir -p _input
          cp tools/visuals/notebooks/*.ipynb _input/
      - name: Build JupyterLite site
        run: jupyter lite build --contents _input/ --output-dir _notebooks/
      - name: Upload notebooks artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: notebooks
          path: _notebooks/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-docs, build-notebooks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download rustdoc
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rustdoc
          path: _site
      - name: Download notebooks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: notebooks
          path: _site/notebooks
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
